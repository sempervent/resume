[project]
name = "career-docs"
version = "0.1.0"
description = "Generate résumés, an academic CV, and cover letters from one career inventory."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.4",
    "pybtex>=0.24.0",
    "pydantic>=2.7",
    "pyyaml>=6.0.2",
]

[project.scripts]
career-docs = "career_docs.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/career_docs"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
